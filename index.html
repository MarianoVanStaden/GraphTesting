<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Control de Calidad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <h1>Trabajo Práctico Nº4</h1>
    <h2>Instituto Superior IDRA</h2>
    <h3>Fridlmeier-Seitz-Van Staden</h3>
    <h4>Gráfico de Control</h4>

    <!-- Selector de caso -->
    <label for="case-selector">Seleccionar caso:</label>
    <select id="case-selector">
        <option value="1">Caso fuera de control</option>
        <option value="2">Caso normal</option>
        <option value="3">Tendencia fuera de control (2 de 3 puntos fuera de 2-sigma)</option>
        <option value="4">Tendencia fuera de control (4 de 5 puntos fuera de sigma)</option>
        <option value="5">Tendencia fuera de control (8 puntos en un mismo lado)</option>
    </select>

    <!-- Contenedor para el gráfico -->
    <div id="chart-container" style="width: 600px; height: 400px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
